name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TeamSpeak plugin SDK
        run: git clone --depth=1 https://github.com/teamspeak/ts3client-pluginsdk.git /tmp/ts3client-pluginsdk
      - name: Configure
        run: cmake -S . -B build -DTS3_SDK_DIR=/tmp/ts3client-pluginsdk -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package Linux plugin
        run: tar -czf PokeWave-linux-x64.tar.gz -C build pokewave.so
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeWave-linux-x64
          path: PokeWave-linux-x64.tar.gz

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TeamSpeak plugin SDK
        shell: pwsh
        run: git clone --depth=1 https://github.com/teamspeak/ts3client-pluginsdk.git "$env:RUNNER_TEMP\ts3client-pluginsdk"
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DTS3_SDK_DIR=$env:RUNNER_TEMP\ts3client-pluginsdk" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Windows plugin binary
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\pokewave.dll")) { throw "pokewave.dll was not produced" }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($null -ne $dumpbin) {
            & $dumpbin.Source /exports "build\Release\pokewave.dll" | Select-String "ts3plugin_"
            if ($LASTEXITCODE -ne 0) { throw "plugin export inspection failed" }
          } else {
            Write-Host "dumpbin.exe is not on PATH; DLL existence was verified."
          }
      - name: Package Windows plugin
        shell: pwsh
        run: Compress-Archive -Path "build\Release\pokewave.dll", "README.md" -DestinationPath "PokeWave-windows-x64.zip"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeWave-windows-x64
          path: PokeWave-windows-x64.zip


  runtime-smoke:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Download Windows plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: PokeWave-windows-x64
          path: package
      - name: Extract plugin package
        shell: pwsh
        run: Expand-Archive -Path "package\PokeWave-windows-x64.zip" -DestinationPath package\extracted -Force
      - name: Download TeamSpeak 3 client
        shell: pwsh
        run: |
          $url = "https://files.teamspeak-services.com/releases/client/3.6.2/TeamSpeak3-Client-win64-3.6.2.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\TeamSpeak3-Client-win64-3.6.2.exe"
          $size = (Get-Item "$env:RUNNER_TEMP\TeamSpeak3-Client-win64-3.6.2.exe").Length
          if ($size -lt 50000000) { throw "TeamSpeak installer download is unexpectedly small: $size bytes" }
      - name: Extract TeamSpeak 3 client
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\TeamSpeak3-Client-win64-3.6.2.exe"
          $extract = "$env:RUNNER_TEMP\ts3-client"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($null -eq $sevenZip) { throw "7z.exe is required on the Windows runner" }
          & $sevenZip.Source x $installer "-o$extract" -y
          if ($LASTEXITCODE -ne 0) { throw "TeamSpeak package extraction failed" }
          $client = Get-ChildItem -Path $extract -Filter "ts3client_win64.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $client) { throw "TeamSpeak 3 client executable was not found after extraction" }
          "TS3CLIENT_EXE=$($client.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "TS3CLIENT_DIR=$($client.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Using TeamSpeak client: $($client.FullName)"
      - name: Verify command keyword and GUI callback
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PokeWaveNative {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibrary(string path);
              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, ExactSpelling = true)]
              public static extern IntPtr GetProcAddress(IntPtr module, string name);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindow(string className, string windowName);
              [DllImport("user32.dll")]
              public static extern bool DestroyWindow(IntPtr window);
              [UnmanagedFunctionPointer(CallingConvention.Cdecl)]
              public delegate int OffersConfigureDelegate();
              [UnmanagedFunctionPointer(CallingConvention.Cdecl)]
              public delegate IntPtr KeywordDelegate();
              [UnmanagedFunctionPointer(CallingConvention.Cdecl)]
              public delegate int ProcessCommandDelegate(ulong schid, [MarshalAs(UnmanagedType.LPStr)] string command);
              [UnmanagedFunctionPointer(CallingConvention.Cdecl)]
              public delegate void MenuDelegate(ulong schid, int type, int menuItemId, ulong selectedItemId);
              [UnmanagedFunctionPointer(CallingConvention.Cdecl)]
              public delegate void ShutdownDelegate();
          }
          '@
          function Get-PokeDelegate([IntPtr] $module, [string] $name, [Type] $type) {
            $address = [PokeWaveNative]::GetProcAddress($module, $name)
            if ($address -eq [IntPtr]::Zero) { throw "Missing export: $name" }
            return [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($address, $type)
          }
          $dll = (Resolve-Path "package\extracted\pokewave.dll").Path
          $module = [PokeWaveNative]::LoadLibrary($dll)
          if ($module -eq [IntPtr]::Zero) { throw "LoadLibrary failed for pokewave.dll" }
          $offers = Get-PokeDelegate $module "ts3plugin_offersConfigure" ([PokeWaveNative+OffersConfigureDelegate])
          if ($offers.Invoke() -ne 0) { throw "PokeWave unexpectedly offers a Settings configure page" }
          $keyword = Get-PokeDelegate $module "ts3plugin_commandKeyword" ([PokeWaveNative+KeywordDelegate])
          $keywordText = [Runtime.InteropServices.Marshal]::PtrToStringAnsi($keyword.Invoke())
          if ($keywordText -ne "pokewave") { throw "Unexpected command keyword: $keywordText" }
          $processCommand = Get-PokeDelegate $module "ts3plugin_processCommand" ([PokeWaveNative+ProcessCommandDelegate])
          if ($processCommand.Invoke([UInt64]0, "help") -ne 0) { throw "help command was not handled" }
          $menu = Get-PokeDelegate $module "ts3plugin_onMenuItemEvent" ([PokeWaveNative+MenuDelegate])
          $menu.Invoke([UInt64]0, 0, 1, [UInt64]0)
          Start-Sleep -Milliseconds 500
          $window = [PokeWaveNative]::FindWindow("PokeWaveGuiWindow", "PokeWave")
          if ($window -eq [IntPtr]::Zero) { throw "PokeWave GUI window was not created by the menu callback" }
          Write-Host "Command keyword and Win32 GUI callback verified."
          [PokeWaveNative]::DestroyWindow($window) | Out-Null
          $shutdown = Get-PokeDelegate $module "ts3plugin_shutdown" ([PokeWaveNative+ShutdownDelegate])
          $shutdown.Invoke()
          $module = [IntPtr]::Zero

      - name: Load plugin in TeamSpeak client
        shell: pwsh
        run: |
          $clientExe = Get-ChildItem -Path "$env:RUNNER_TEMP\ts3-client" -Filter "ts3client_win64.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $clientExe) { throw "TeamSpeak 3 client executable disappeared before launch" }
          $pluginDirs = @(
            (Join-Path $env:APPDATA "TS3Client\plugins"),
            (Join-Path $clientExe.DirectoryName "plugins")
          )
          foreach ($pluginDir in $pluginDirs) {
            New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
            Copy-Item "package\extracted\pokewave.dll" (Join-Path $pluginDir "pokewave.dll") -Force
          }
          $client = Start-Process -FilePath $clientExe.FullName -ArgumentList "-nosingleinstance" -PassThru
          Start-Sleep -Seconds 12
          $client.Refresh()
          if ($client.HasExited) { throw "TeamSpeak client exited during plugin smoke test with code $($client.ExitCode)" }
          $loaded = $false
          try {
            $loaded = @($client.Modules | Where-Object { $_.ModuleName -ieq "pokewave.dll" }).Count -gt 0
          } catch {
            Write-Host "Process module enumeration failed: $($_.Exception.Message)"
          }
          if (!$loaded) {
            $loaded = @((Get-Process -Id $client.Id).Modules | Where-Object { $_.ModuleName -ieq "pokewave.dll" }).Count -gt 0
          }
          if (!$loaded) { throw "TeamSpeak started, but pokewave.dll was not observed in its loaded modules" }
          Write-Host "PokeWave DLL was loaded by TeamSpeak 3."
          Stop-Process -Id $client.Id -Force


  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release PokeWave')
    needs: [linux-build, windows-build, runtime-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PokeWave-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.3
          name: PokeWave v0.3.3
          target_commitish: main
          generate_release_notes: true
          files: |
            release-assets/PokeWave-windows-x64.zip
            release-assets/PokeWave-linux-x64.tar.gz
